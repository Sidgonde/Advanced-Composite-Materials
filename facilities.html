<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACM | Lab Facilities</title>
  <link rel="icon" href="./assets/images/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/navbar.css" />
  <link rel="stylesheet" href="./assets/css/facilities.css" />
  <link rel="stylesheet" href="./assets/css/footer.css" />
</head>
<body>

  <div id="navbar-placeholder"></div>

  <section class="ribbon">
    <h1 id="ribbonTitle"></h1>
    <p id="ribbonDesc"></p>
  </section>

  <section class="fac-stats">
    <div class="fac-stats-grid" id="facStatsGrid"></div>
  </section>

  <section class="fac-section">
    <div class="fac-container">

      <div class="fac-filter" id="facFilter"></div>

      <div class="fac-grid" id="facGrid"></div>

      <div class="fac-empty hidden" id="facEmpty">
        <i data-icon="search"></i>
        <p>No equipment found in this category.</p>
      </div>

      <p class="fac-booking-note" id="facBookingNote" hidden></p>

    </div>
  </section>

  <section class="fac-info-section">
    <div class="fac-container">
      <div class="fac-info-grid" id="facInfoGrid"></div>
    </div>
  </section>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="./assets/js/app.js"></script>
  <script type="module" src="./assets/js/facilities.js"></script>

</body>
</html>
