<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACM | Contact Us</title>
  <link rel="icon" href="./assets/images/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
  />

  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/navbar.css" />
  <link rel="stylesheet" href="./assets/css/contact.css" />
  <link rel="stylesheet" href="./assets/css/footer.css" />
</head>

<body>
  <div id="navbar-placeholder"></div>

  <section class="contact-section">
    <div class="contact-container">

      <div class="contact-visual">
        <img
          src="./assets/images/contact-animation.gif"
          alt="Contact illustration"
          loading="lazy"
        />
      </div>

      <div class="contact-form-wrapper">
        <h2></h2>
        <p class="subtitle"></p>

        <div class="info-box">
          <p>Email : <strong id="emailid"></strong></p>
        </div>

        <div class="social-links">
          <span>Follow us:</span>
          <a id="twitter-link" target="_blank" rel="noopener">
            <img src="./assets/images/Twitter.svg" alt="Twitter / X" />
          </a>
          <a id="linkedin-link" target="_blank" rel="noopener">
            <img src="./assets/images/linkedin.svg" alt="LinkedIn" />
          </a>
        </div>

        <form
          id="contactForm"
          action="https://formspree.io/f/xbdlpeyw"
          method="POST"
        >
          <label for="contact-name" class="sr-only">Your name</label>
          <input id="contact-name" type="text" name="name" placeholder="Name" required autocomplete="name" />

          <label for="contact-email" class="sr-only">Email address</label>
          <input id="contact-email" type="email" name="email" placeholder="Email address" required autocomplete="email" />

          <label for="contact-subject" class="sr-only">Subject</label>
          <input id="contact-subject" type="text" name="subject" placeholder="Subject" required />

          <label for="contact-message" class="sr-only">Message</label>
          <textarea
            id="contact-message"
            rows="4"
            name="message"
            placeholder="Message"
            required
          ></textarea>
          <button type="submit" class="submit-btn">Send message</button>
        </form>
      </div>
    </div>
  </section>

  <section class="positions-section" id="positions">
    <div class="positions-inner">
      <h2 class="positions-heading">Open Positions <span id="positionsCount" class="positions-count" hidden></span></h2>
      <p class="positions-intro">Join our group — current openings for researchers and students.</p>
      <div id="positionsContainer" class="positions-grid"></div>
    </div>
  </section>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="./assets/js/app.js"></script>
  <script type="module" src="./assets/js/positions.js"></script>

  <script type="module" src="./assets/js/contact.js"></script>
</body>
</html>
