<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ACM | Publications</title>
    <link rel="icon" href="./assets/images/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/journals.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/navbar.css" />
    <link rel="stylesheet" href="./assets/css/card.css" />
    <link rel="stylesheet" href="./assets/css/footer.css" />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <section class="ribbon">
      <div class="ribbon-content">
        <h1 id="ribbonTitle"></h1>
        <p id="ribbonDesc"></p>
      </div>
    </section>

    <section class="recent-section">
      <div class="container">
        <h2 id="recentTitle"></h2>
        <p id="recentSubtitle"></p>
        <div id="recentCards" class="recent-grid"></div>
      </div>
    </section>

    <section class="journals-section">
      <div class="container" id="journalsContainer"></div>
    </section>

    <div id="modalOverlay" class="modal-overlay">
      <div class="modal-box">
        <span class="close-modal">&times;</span>
        <h3 id="modalTitle"></h3>
        <p id="modalContent"></p>
      </div>
    </div>

    <div id="imageModalOverlay" class="image-modal-overlay">
      <div class="image-modal-box">
        <button type="button" id="imageModalClose" class="image-modal-close" aria-label="Close">&times;</button>
        <img id="imageModalImg" src="" alt="" />
      </div>
    </div>

    <footer id="footer-placeholder"></footer>

    <script type="module" src="./assets/js/journals.js"></script>
    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
