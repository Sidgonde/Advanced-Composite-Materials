<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACM | Gallery</title>
  <link rel="icon" href="./assets/images/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/gallery.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/navbar.css" />
  <link rel="stylesheet" href="./assets/css/footer.css" />
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="hero">
  <div class="hero-deco"></div>
  <div class="hero-deco hero-deco--sm"></div>
  <div class="hero-line"></div>
  <h1>Research <span>Gallery</span></h1>
  <p>A visual chronicle of conferences, workshops, field studies, and milestones that define our research journey.</p>
  <div class="breadcrumb" aria-label="Breadcrumb">
    <a href="./index.html">Home</a>
    <span class="sep" aria-hidden="true">›</span>
    <span class="cur" aria-current="page">Gallery</span>
  </div>
</section>

<div class="filter-wrap">
  <div class="filter-bar" id="filterBar">
  </div>
</div>

<main>
  <div class="gallery-stats" id="galleryStats"></div>
  <div class="masonry-grid" id="masonryGrid">
    <div class="loading-state">Loading gallery…</div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">

    <button class="modal-close" id="modalClose" aria-label="Close">
      <i data-icon="x"></i>
    </button>

    <button class="modal-nav modal-nav--prev" id="modalPrev" aria-label="Previous">
      <i data-icon="chevron-left"></i>
    </button>
    <button class="modal-nav modal-nav--next" id="modalNext" aria-label="Next">
      <i data-icon="chevron-right"></i>
    </button>

    <div class="modal-inner">
      <div class="modal-img-pane">
        <img id="modalImg" src="" alt="" />
        <div class="modal-img-fallback" id="modalFallback">
          <i data-icon="image"></i>
        </div>
        <div class="modal-counter" id="modalCounter"></div>
      </div>

      <div class="modal-info-pane">
        <div class="modal-category" id="modalCategory"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-desc"  id="modalDesc"></p>

        <div class="modal-meta">
          <div class="modal-meta-row">
            <div class="modal-meta-icon">
              <i data-icon="map-pin"></i>
            </div>
            <div>
              <span class="modal-meta-label">Venue</span>
              <span class="modal-meta-value" id="modalVenue"></span>
            </div>
          </div>

          <div class="modal-meta-row">
            <div class="modal-meta-icon">
              <i data-icon="calendar"></i>
            </div>
            <div>
              <span class="modal-meta-label">Timeline</span>
              <span class="modal-meta-value" id="modalTimeline"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer id="footer-placeholder"></footer>

<script type="module" src="./assets/js/app.js"></script>
<script type="module" src="assets/js/gallery.js"></script>
</body>
</html>
